# Golden tests compare rendered pixels, and pixel output is not identical
# across operating systems: the same source renders the same layout with
# different glyph anti-aliasing. Measured at 4.96% differing pixels between
# macOS and Linux with the identical Flutter version and bundled font.
#
# They are therefore tagged rather than deleted, and excluded in CI:
#   flutter test --exclude-tags golden
# Run them locally on the platform that generated the baselines.
tags:
  golden:
    description: Pixel-comparison tests; baselines are platform-specific.
